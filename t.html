<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>转到待办</title>
<script>
// 2026-09-15：口令 / 一次码可能跟在网址后面（#k= / #c= / ?k=）。
// 放在统计代码之前：先存进这台手机，再把口令从地址栏抹掉，免得被统计代码记走。
(function () {
  try {
    var h = new URLSearchParams(location.hash.slice(1));
    var k = h.get('k') || new URLSearchParams(location.search).get('k');
    if (h.has('reset')) localStorage.removeItem('td_todo_k');
    if (k) localStorage.setItem('td_todo_k', k);
    var c = h.get('c');
    if (c) sessionStorage.setItem('td_todo_c', c);
    // 2026-09-24：加密卡片页的钥匙（电脑屏幕上扫码带进来，只存这台手机）
    var key = h.get('key');
    if (key) localStorage.setItem('td_todo_key', key);
    if (k || key || location.search || h.has('reset')) {
      history.replaceState(null, '', location.pathname + (c ? '#c=' + encodeURIComponent(c) : ''));
    }
  } catch (e) {}
})();
</script>
<!--
  固定入口 —— 手机待办页的书签存这一页，不要存 trycloudflare 那个网址。

  为什么要有这一页（2026-08-26 建）：
  手机待办页走的是 cloudflare 临时隧道，`cloudflared` 一重启网址就换一个，
  手机上存的书签当场变死链，⛔ 而且零告警 —— 页面服务还活着、日志一片正常，
  只有他打不开，多半还以为是网卡了。
  这一页在官网上，地址永远是 https://tdgroup.hk/t.html ；真正会变的那个网址
  放在同目录的 t.json 里，由 商务\待办\推网址到官网.py 在隧道换址时改掉并推上来。

  ⛔ 口令永远不许写进这个仓库（它是公开的）。口令只存在他手机浏览器的
  localStorage 里，第一次手输一次。没口令的人拿到 t.json 里那个网址也只会吃 401。
-->
<style>
  :root{--bg:#0f1115;--fg:#e8e6e3;--dim:#9aa0a6;--gold:#c8a35a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--fg);
       font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       padding:24px}
  .box{width:100%;max-width:420px;text-align:center}
  h1{font-size:19px;font-weight:600;margin:0 0 6px}
  p{color:var(--dim);font-size:14px;margin:8px 0}
  input{width:100%;padding:13px 14px;margin-top:14px;border-radius:10px;
        border:1px solid #2c3038;background:#171a20;color:var(--fg);font-size:16px}
  button{width:100%;padding:13px;margin-top:10px;border:0;border-radius:10px;
         background:var(--gold);color:#1a1a1a;font-size:16px;font-weight:600}
  a{color:var(--gold);word-break:break-all;font-size:13px}
  .hide{display:none}
</style>
<script defer src="js/assistant.js"></script>

</head>
<body>
<div class="box">
  <div id="wait"><h1>正在转到待办…</h1><p id="tip">在找当前的地址</p></div>

  <div id="ask" class="hide">
    <h1>第一次打开，输一次口令</h1>
    <p>输过就记住了，以后直接开这一页</p>
    <input id="k" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" placeholder="口令">
    <button id="go">进去</button>
  </div>

  <div id="wx" class="hide">
    <h1>微信里打不开待办，点右上角「···」</h1>
    <p>再点「在浏览器打开」，之后就一直在浏览器里用</p>
    <p style="font-size:40px;line-height:1;margin:18px 0 0;color:var(--gold)">↗</p>
    <p><a id="wxtry" href="#">不行的话，点这里在微信里硬试一次</a></p>
  </div>

  <div id="fail" class="hide">
    <h1>暂时进不去</h1>
    <p id="why"></p>
    <p><a id="raw" href="#"></a></p>
  </div>
</div>
<script>
(function () {
  var KEY = 'td_todo_k';
  var $ = function (id) { return document.getElementById(id); };
  var show = function (id) {
    ['wait', 'ask', 'wx', 'fail'].forEach(function (x) {
      $(x).className = (x === id) ? '' : 'hide';
    });
  };
  var die = function (msg, url) {
    $('why').textContent = msg;
    if (url) { $('raw').href = url; $('raw').textContent = url; }
    show('fail');
  };

  // ⭐ 2026-09-24 起先走加密页：卡片加密后放在 tdgroup.hk/tdm/d.json，这里取回来解密显示，
  //   全程不跳 trycloudflare（微信会拦它、换浏览器要重输口令、隧道一重启就换址 —— 那三样就是「老失效」）。
  //   没钥匙 / 手机不支持解密 / 取不到，才回落下面的老隧道路子。
  var b64 = function (s) { var b = atob(s), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  var ukey = function (s) { s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '='; return b64(s); };
  var sealed = function () {
    var kk = null;
    try { kk = localStorage.getItem('td_todo_key'); } catch (e) {}
    if (!kk || !(window.crypto && crypto.subtle)) return Promise.reject(new Error('nokey'));
    $('tip').textContent = '正在解开待办';
    var meta;
    return fetch('/tdm/d.json?_=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('d.json ' + r.status); return r.json(); })
      .then(function (d) {
        meta = d;
        return crypto.subtle.importKey('raw', ukey(kk), 'AES-GCM', false, ['decrypt'])
          .then(function (ck) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(d.iv) }, ck, b64(d.ct)); });
      })
      .then(function (buf) {
        var html = new TextDecoder('utf-8').decode(buf);
        // 手机上点过「发完了」但当时没连上电脑的，补发一次；补发成功的从手机里删掉
        var m = html.match(/var TUN=("[^"]*"),TK=("[^"]*")/);
        var pend = [];
        try { pend = JSON.parse(localStorage.getItem('td_pending') || '[]'); } catch (e) {}
        if (m && pend.length) {
          var tun = JSON.parse(m[1]), tk = JSON.parse(m[2]);
          if (tun) pend.forEach(function (x) {
            fetch(tun + '/mark?k=' + encodeURIComponent(tk), { method: 'POST', body: JSON.stringify({ id: x.id, st: x.st }) })
              .then(function (r) { return r.json(); })
              .then(function (j) { if (j.ok || /没找到/.test(j.err || '')) {
                var q = JSON.parse(localStorage.getItem('td_pending') || '[]').filter(function (y) { return y.id !== x.id; });
                localStorage.setItem('td_pending', JSON.stringify(q)); } }).catch(function () {});
          });
        }
        var tail = '<div class="tip">更新于 ' + String(meta.ts || '') + '</div>' +
          '<script>try{JSON.parse(localStorage.getItem("td_pending")||"[]").forEach(function(x){' +
          'var c=document.getElementById("c_"+x.id);if(c)c.classList.add("gone");});}catch(e){}<\/script></body>';
        document.open(); document.write(html.replace('</body>', tail)); document.close();
      });
  };

  // 口令：head 里那段已经把网址上带的存进来了，这里只读这台手机存过的；
  // 一次码（推到微信的登录链接）优先 —— 存着的口令可能是错的
  var k = null, c = null;
  try { k = localStorage.getItem(KEY); } catch (e) {}
  try { c = sessionStorage.getItem('td_todo_c'); } catch (e) {}

  var legacy = function () {
  // t.json 会被改写，⛔ 一定要绕开缓存，否则隧道换址后这里还拿着旧的
  fetch('t.json?_=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('t.json ' + r.status);
      return r.json();
    })
    .then(function (d) {
      var base = (d && d.url ? String(d.url) : '').replace(/\/+$/, '');
      if (!base) throw new Error('t.json 里没有网址');
      var jump = function (tok) { location.replace(base + '/?k=' + encodeURIComponent(tok)); };
      // 2026-09-15：微信内置浏览器会拦 trycloudflare 那个域名（推到微信的链接点开就打不开）。
      // 在微信里就不往隧道跳，引导他「在浏览器打开」；这台手机微信里记过口令的，
      // 把口令放进当前网址，浏览器打开时带过去，省得再输一次。
      var login = function (code) {
        try { sessionStorage.removeItem('td_todo_c'); } catch (e) {}
        location.replace(base + '/go?c=' + encodeURIComponent(code));
      };
      if (/MicroMessenger/i.test(navigator.userAgent)) {
        // 「在浏览器打开」带走的是当前网址，所以把一次码或口令放进 # 里（# 后面的不会发给服务器）
        var carry = c ? 'c=' + encodeURIComponent(c) : (k ? 'k=' + encodeURIComponent(k) : '');
        if (carry) { try { history.replaceState(null, '', 't.html#' + carry); } catch (e) {} }
        $('wxtry').onclick = function (e) {
          e.preventDefault();
          if (c) { login(c); } else if (k) { jump(k); } else { show('ask'); }
        };
        show('wx');
        $('go').onclick = function () {
          var v = $('k').value.trim();
          if (!v) return;
          try { localStorage.setItem(KEY, v); } catch (e) {}
          jump(v);
        };
        return;
      }
      if (c) { login(c); return; }
      if (k) { jump(k); return; }
      show('ask');
      var send = function () {
        var v = $('k').value.trim();
        if (!v) return;
        try { localStorage.setItem(KEY, v); } catch (e) {}
        jump(v);
      };
      $('go').onclick = send;
      $('k').addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
    })
    .catch(function (e) {
      die('拿不到当前地址（' + e.message + '）。多半是家里那台电脑没开机，或者隧道刚好在重开，过几分钟再试。');
    });
  };
  sealed().catch(function (e) {
    if (e && e.message !== 'nokey') { try { console.warn(e); } catch (x) {} }
    legacy();
  });
})();
</script>
</body>
</html>
